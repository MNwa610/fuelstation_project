services:
  db:
    image: postgres:16
    container_name: fuelstation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fuelstation
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuelstation"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: fuelstation-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/fuelstation?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
        VITE_YANDEX_MAPS_KEY: ${VITE_YANDEX_MAPS_KEY}
    container_name: fuelstation-client
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  postgres_data:
